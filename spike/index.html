<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoom spike</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; --panel: rgba(13, 18, 28, 0.78); --line: rgba(148, 163, 184, 0.18); --text: #cbd5e1; --dim: #64748b; --accent: #fbbf24; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #04060c; color: var(--text); font: 12px/1.4 'Segoe UI', Inter, system-ui, sans-serif; }
    #stage, #stage canvas { position: fixed; inset: 0; display: block; }
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); }
    #top { top: 12px; left: 12px; right: 12px; display: flex; gap: 12px; align-items: center; padding: 6px 8px; pointer-events: none; background: none; border: 0; backdrop-filter: none; }
    #top > * { pointer-events: auto; }
    #brand { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; color: var(--accent); padding: 8px 12px; }
    #models { display: flex; gap: 2px; padding: 3px; max-width: 46vw; overflow-x: auto; scrollbar-width: none; }
    #models a { color: var(--dim); text-decoration: none; padding: 5px 9px; border-radius: 7px; white-space: nowrap; flex: none; max-width: 11em; overflow: hidden; text-overflow: ellipsis; }
    #models a.on { color: var(--text); background: rgba(148, 163, 184, 0.14); }
    #models a.imported { color: #fde68a; }
    #crumbs { position: fixed; top: 64px; left: 24px; display: flex; gap: 2px; align-items: center; padding: 3px; flex-wrap: wrap; max-width: 60vw; }
    #crumbs button { background: none; border: 0; color: var(--dim); font: inherit; padding: 5px 8px; border-radius: 7px; cursor: pointer; }
    #crumbs button + button::before { content: '›'; margin-right: 8px; color: #334155; }
    #crumbs button:hover { color: var(--text); }
    #crumbs button.here { color: var(--text); font-weight: 600; }
    #stats { left: 12px; bottom: 12px; padding: 10px 12px; white-space: pre; font: 11px/1.6 ui-monospace, 'Cascadia Mono', Consolas, monospace; color: #94a3b8; }
    #minimap { right: 12px; bottom: 40px; width: 240px; height: 150px; cursor: crosshair; }
    #details { top: 72px; right: 12px; width: 330px; max-height: calc(100vh - 290px); overflow: auto; padding: 16px 16px 12px; }
    #details[hidden] { display: none; }
    .d-head { display: flex; flex-direction: column; gap: 6px; }
    .d-kind { align-self: flex-start; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #0b0f17; background: #fbbf24; border-radius: 4px; padding: 2px 7px; font-weight: 700; }
    #details h2 { margin: 0; font-size: 19px; color: #f1f5f9; font-weight: 650; }
    .d-path { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 6px; }
    .d-path button, .d-rels button { background: none; border: 0; color: var(--dim); font: inherit; padding: 2px 4px; cursor: pointer; border-radius: 5px; }
    .d-path button + button::before { content: '›'; margin-right: 6px; color: #334155; }
    .d-path button:hover, .d-rels button:hover { color: var(--text); background: rgba(148, 163, 184, 0.1); }
    .d-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 4px; }
    .d-tags span { font-size: 11px; color: #cbd5e1; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
    #details p { color: #94a3b8; margin: 10px 0 4px; line-height: 1.5; }
    .d-rels { margin-top: 12px; display: flex; flex-direction: column; }
    .d-rels h3 { margin: 0 0 4px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
    .d-rels.out h3, .d-rels.out i { color: #fbbf24; }
    .d-rels.in h3, .d-rels.in i { color: #22d3ee; }
    .d-rels button { display: grid; grid-template-columns: 16px 1fr; text-align: left; padding: 4px 6px; }
    .d-rels i { font-style: normal; grid-row: span 2; }
    .d-rels b { color: #e2e8f0; font-weight: 600; }
    .d-rels button span { color: var(--dim); font-size: 11px; }
    #code { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .code { position: absolute; overflow: hidden; background: rgba(3, 6, 12, 0.7); border-radius: 6px; }
    .code[hidden] { display: none; }
    /* Both are laid out at 16 px from the card's top-left and scaled; columns sit where the code view puts them. */
    .code pre, .code canvas { position: absolute; left: 0; top: 0; margin: 0; transform-origin: 0 0; }
    .code pre[hidden] { display: none; }
    .code pre { font: 16px/1.45 ui-monospace, Consolas, monospace; color: #cbd5e1; }
    .code pre div { position: absolute; overflow: hidden; }
    .code pre span { display: block; white-space: pre; }
    .code pre i { font-style: normal; color: #475569; margin-right: 1ch; }
    .code pre em { font-style: normal; }
    .code pre .kw { color: #c4b5fd; }
    .code pre .str { color: #86efac; }
    .code pre .com { color: #64748b; font-style: italic; }
    .code pre .num { color: #fdba74; }
    .code pre .ty { color: #7dd3fc; }
    /* Lines the graph marked: a cyan edge and their kind; lines a link cites: amber. */
    .code pre .mark { box-shadow: inset 3px 0 #22d3ee; background: rgba(34, 211, 238, 0.07); }
    .code pre span b { margin-left: 2ch; padding: 0 0.6ch; font-weight: 600; font-size: 0.8em; color: #67e8f9; border: 1px solid rgba(34, 211, 238, 0.5); border-radius: 4px; }
    .code pre .cited { background: rgba(251, 191, 36, 0.16); box-shadow: inset 3px 0 #fbbf24; }
    .code pre .cited b { color: #fde68a; border-color: rgba(251, 191, 36, 0.6); }
    .d-ev { margin: 0 0 6px 22px; display: flex; flex-direction: column; gap: 4px; }
    .d-ev > div { border-left: 2px solid var(--line); padding: 1px 0 1px 8px; }
    .d-ev .at { font-size: 10px; color: #64748b; font-family: ui-monospace, Consolas, monospace; }
    .d-ev pre { margin: 1px 0 0; font: 11px/1.45 ui-monospace, Consolas, monospace; color: #cbd5e1; white-space: pre; overflow-x: auto; }
    .d-ev .stale { border-left-color: #b45309; }
    .d-ev .open { cursor: pointer; border-radius: 0 5px 5px 0; }
    .d-ev .open:hover { background: rgba(148, 163, 184, 0.1); border-left-color: #fbbf24; }
    .d-ev .open:hover .at { color: #fbbf24; }
    .d-ev em { display: block; font-size: 11px; color: #f59e0b; }
    .d-ev button.more { display: inline-block; align-self: flex-start; font-size: 11px; padding: 1px 6px; }
    .d-hint { margin-top: 12px; color: #475569; font-size: 11px; }
    #help { right: 12px; bottom: 12px; color: var(--dim); font-size: 11px; position: fixed; }
    #sound { background: var(--panel); border: 1px solid var(--line); color: var(--dim); border-radius: 10px; padding: 8px 12px; font: inherit; cursor: pointer; }
    #sound.on { color: var(--accent); border-color: rgba(251, 191, 36, 0.4); }
    .lensbar { position: static; margin-left: auto; display: flex; align-items: center; gap: 2px; padding: 3px; }
    .lensbar button { background: none; border: 0; color: var(--dim); font: inherit; padding: 5px 9px; border-radius: 7px; cursor: pointer; }
    .lensbar button.on { color: #0b0f17; background: var(--accent); font-weight: 600; }
    .lens-legend { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; color: var(--dim); font-size: 11px; }
    .lens-legend[hidden] { display: none; }
    .lens-ramp { width: 110px; height: 8px; border-radius: 4px; }
    /* Altimeter: depth gauge on the left edge. */
    .alt { position: fixed; left: 22px; top: 50%; transform: translateY(-50%); height: 46vh; width: 120px; pointer-events: none; font: 600 9px/1 ui-monospace, 'Cascadia Mono', Consolas, monospace; letter-spacing: 0.12em; color: #475569; }
    .alt-title { position: absolute; top: -26px; left: 0; color: #64748b; }
    .alt-rail { position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: linear-gradient(#1e293b, #334155, #1e293b); border-radius: 1px; }
    .alt-tick { position: absolute; left: -4px; width: 10px; height: 1px; background: #334155; padding-left: 18px; line-height: 0; white-space: nowrap; transition: color 0.3s; }
    .alt-tick.on { color: #94a3b8; background: #64748b; }
    .alt-marker { position: absolute; left: -7px; width: 16px; height: 16px; margin-top: -8px; border: 2px solid var(--accent); border-radius: 50%; box-shadow: 0 0 12px rgba(251, 191, 36, 0.6); background: rgba(251, 191, 36, 0.15); }
    .alt-readout { position: absolute; bottom: -28px; left: 0; color: var(--accent); font-size: 11px; }
    /* Region title card. */
    .banner { position: fixed; top: 108px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; opacity: 0; }
    .banner.show { animation: banner 2.6s ease forwards; }
    .banner-kicker { font: 600 10px ui-monospace, Consolas, monospace; letter-spacing: 0.4em; color: var(--accent); }
    .banner-title { font: 300 34px/1.15 'Segoe UI', Inter, sans-serif; letter-spacing: 0.06em; color: #f1f5f9; text-shadow: 0 0 24px rgba(96, 165, 250, 0.45); margin-top: 4px; }
    .banner-sub { font-size: 12px; color: #94a3b8; letter-spacing: 0.08em; margin-top: 4px; }
    .banner-title::after { content: ''; display: block; height: 1px; margin: 8px auto 0; width: 0; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: rule 2.6s ease forwards; }
    @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -8px); letter-spacing: 0.02em; } 14% { opacity: 1; transform: translate(-50%, 0); } 72% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 0); } }
    @keyframes rule { 0% { width: 0; } 30% { width: 220px; } 100% { width: 220px; } }
    kbd { font: 600 10px ui-monospace, Consolas, monospace; color: #94a3b8; border: 1px solid #334155; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: rgba(15, 23, 42, 0.8); }
    #travel { width: 240px; text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--dim); border-radius: 10px; padding: 8px 12px; font: inherit; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    #travel:hover { color: var(--text); border-color: rgba(251, 191, 36, 0.4); }
    /* Toast */
    .toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; display: flex; gap: 10px; align-items: center; background: rgba(10, 14, 22, 0.92); border: 1px solid rgba(251, 191, 36, 0.35); color: #e2e8f0; padding: 9px 14px; border-radius: 10px; font-size: 13px; transition: opacity 0.18s, transform 0.18s; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    /* Palette */
    .palette { position: fixed; z-index: 30; left: 50%; top: 14vh; transform: translate(-50%, -8px) scale(0.98); width: min(680px, 90vw); opacity: 0; pointer-events: none; background: rgba(9, 12, 20, 0.96); border: 1px solid rgba(251, 191, 36, 0.35); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7); transition: opacity 0.12s, transform 0.12s; overflow: hidden; }
    .palette.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
    .palette input { width: 100%; background: none; border: 0; border-bottom: 1px solid #1e293b; color: #f1f5f9; font: 17px 'Segoe UI', sans-serif; padding: 16px 18px; outline: none; }
    .palette-list { max-height: 52vh; overflow: auto; padding: 6px; }
    .palette .row { display: grid; grid-template-columns: 86px auto 1fr; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
    .palette .row.on { background: rgba(251, 191, 36, 0.14); }
    .palette .row .kind { font: 600 9px ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #64748b; }
    .palette .row b { color: #e2e8f0; font-weight: 600; }
    .palette .row .sub { color: #475569; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Radial command wheel */
    .radial { position: fixed; z-index: 25; width: 0; height: 0; pointer-events: none; }
    .radial .hub { position: absolute; left: -58px; top: -58px; width: 116px; height: 116px; border-radius: 50%; background: radial-gradient(circle, rgba(15, 23, 42, 0.95) 55%, rgba(15, 23, 42, 0.2)); border: 1px solid rgba(251, 191, 36, 0.4); color: #f1f5f9; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px; transform: scale(0.4); opacity: 0; transition: transform 0.16s, opacity 0.16s; }
    .radial .item { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) scale(0.5); opacity: 0; min-width: 104px; background: rgba(10, 14, 22, 0.95); border: 1px solid #334155; color: #cbd5e1; border-radius: 999px; padding: 7px 12px; font: inherit; display: flex; gap: 8px; justify-content: space-between; align-items: center; cursor: pointer; transition: transform 0.18s cubic-bezier(0.2, 1.4, 0.4, 1), opacity 0.14s, background 0.1s; white-space: nowrap; }
    .radial.open { pointer-events: auto; }
    .radial.open .hub { transform: scale(1); opacity: 1; }
    .radial.open .item { opacity: 1; transform: translate(-50%, -50%) translate(var(--x), var(--y)) scale(1); }
    .radial .item.hot, .radial .item:hover { background: var(--accent); color: #0b0f17; border-color: var(--accent); }
    .radial .item.hot kbd, .radial .item:hover kbd { color: #0b0f17; border-color: rgba(11, 15, 23, 0.35); background: none; }
    .radial .item.off { opacity: 0.35 !important; cursor: default; }
    /* Tooltips */
    .tip { position: fixed; z-index: 20; width: 300px; background: rgba(9, 12, 20, 0.96); border: 1px solid #334155; border-radius: 10px; padding: 11px 13px 13px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6); font-size: 12px; animation: tipin 0.12s ease; }
    .tip.locked { border-color: rgba(251, 191, 36, 0.55); }
    @keyframes tipin { from { opacity: 0; transform: translateY(4px); } }
    .tip-kind { font: 600 9px ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #64748b; }
    .tip-title { font-size: 15px; font-weight: 600; color: #f1f5f9; margin: 2px 0 6px; }
    .tip-desc { color: #94a3b8; line-height: 1.45; margin-bottom: 6px; }
    .tip-counts { color: #64748b; font-size: 11px; margin-bottom: 4px; }
    .tip-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: baseline; }
    .tip-label { font: 600 9px ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #475569; margin-right: 2px; width: 100%; }
    .tip-link { color: #fde68a; border-bottom: 1px dotted #a16207; cursor: pointer; margin-right: 6px; }
    .tip-link:hover { color: #fff; }
    .tip-lock { position: absolute; left: 10px; right: 10px; bottom: 5px; height: 2px; background: #1e293b; border-radius: 1px; overflow: hidden; }
    .tip-lock::after { content: ''; position: absolute; inset: 0; background: var(--accent); transform-origin: left; animation: lock 0.9s linear forwards; }
    @keyframes lock { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    /* Route directions */
    .routepanel { left: 160px; bottom: 108px; width: 300px; max-height: 40vh; overflow: auto; padding: 10px; }
    .routepanel[hidden] { display: none; }
    .rp-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .rp-head b { color: #4ade80; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
    .rp-head span { color: #475569; font-size: 10px; }
    .rp-stop { display: grid; grid-template-columns: 22px 1fr; width: 100%; text-align: left; background: none; border: 0; color: #cbd5e1; font: inherit; padding: 4px; border-radius: 6px; cursor: pointer; }
    .rp-stop:hover, .rp-stop.on { background: rgba(74, 222, 128, 0.12); }
    .rp-stop i { font: 700 10px ui-monospace, monospace; color: #052e16; background: #4ade80; border-radius: 50%; width: 17px; height: 17px; display: flex; align-items: center; justify-content: center; grid-row: span 2; }
    .rp-stop span { color: #64748b; font-size: 11px; }
    /* Controls screen */
    .help-overlay { position: fixed; inset: 0; z-index: 40; background: rgba(3, 5, 10, 0.82); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
    .help-overlay.open { opacity: 1; pointer-events: auto; }
    .help-overlay h2 { font: 300 30px 'Segoe UI', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: #f1f5f9; margin: 0 0 22px; }
    .help-grid { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 40px; max-width: 760px; padding: 0 24px; }
    .help-col h3 { font: 600 11px ui-monospace, monospace; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
    .help-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid #111827; color: #94a3b8; }
    .help-row kbd { white-space: nowrap; }
    .help-foot { margin-top: 24px; color: #475569; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="code"></div>
  <div id="top" class="panel">
    <div id="brand" class="panel" style="position: static">Zoom spike</div>
    <nav id="models" class="panel" style="position: static"></nav>
    <button id="travel">Travel to…<kbd>Ctrl K</kbd></button>
    <button id="sound">Sound off</button>
  </div>
  <div id="crumbs" class="panel"></div>
  <div id="stats" class="panel">loading…</div>
  <aside id="details" class="panel" hidden></aside>
  <canvas id="minimap" class="panel"></canvas>
  <div id="help">scroll to zoom · drag to pan · right-click: command wheel · Ctrl K: travel · ] [: look around · ⌫: back · ?: controls</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
