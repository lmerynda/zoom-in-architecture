<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoom spike</title>
  <link rel="icon" href="data:," />
  <style>
    :root { color-scheme: dark; --panel: rgba(13, 18, 28, 0.78); --line: rgba(148, 163, 184, 0.18); --text: #cbd5e1; --dim: #8a99b0; --faint: #7c8aa1; --accent: #fbbf24; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #04060c; color: var(--text); font: 12px/1.4 'Segoe UI', Inter, system-ui, sans-serif; }
    #stage, #stage canvas { position: fixed; inset: 0; display: block; }
    .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); }
    #top { top: 12px; left: 12px; right: 12px; display: flex; gap: 12px; align-items: center; padding: 6px 8px; pointer-events: none; background: none; border: 0; backdrop-filter: none; z-index: 20; }
    #top > * { pointer-events: auto; }
    #brand { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; color: var(--accent); padding: 8px 12px; }
    /* One button names the open model; its menu lists the others, so the bar stays one line. */
    #models { position: relative; padding: 3px; min-width: 0; }
    .model-current { background: none; border: 0; color: var(--text); font: inherit; font-weight: 600; padding: 5px 10px; border-radius: 7px; cursor: pointer; max-width: 22em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .model-current::after { content: ' ▾'; color: var(--dim); font-weight: 400; }
    .model-current:hover { background: rgba(148, 163, 184, 0.12); }
    .model-menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 240px; max-height: 70vh; overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 1px; z-index: 30; background: #0b1220; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); }
    .model-menu[hidden] { display: none; }
    .model-menu .menu-head { font: 600 10px ui-monospace, Consolas, monospace; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); padding: 8px 9px 4px; }
    .model-menu a { color: var(--dim); text-decoration: none; padding: 6px 9px; border-radius: 7px; white-space: nowrap; }
    .model-menu a:hover { color: var(--text); background: rgba(148, 163, 184, 0.1); }
    .model-menu a.on { color: var(--text); background: rgba(148, 163, 184, 0.16); }
    .model-menu a.imported { color: #fde68a; }
    /* The open model's views sit with the lenses on the right: ways of looking at it, not other models. */
    /* In a narrow window the travel box gives way; the controls around it keep their size. */
    #brand, #views, .lensbar { flex: none; white-space: nowrap; }
    #travel { min-width: 0; }
    #views { display: flex; gap: 2px; padding: 3px; margin-left: auto; }
    #views[hidden] { display: none; }
    #views:not([hidden]) + .lensbar { margin-left: 0; }
    #views a { color: var(--dim); text-decoration: none; padding: 5px 9px; border-radius: 7px; white-space: nowrap; }
    #views a:hover { color: var(--text); }
    #views a.on { color: #0b0f17; background: #6ee7b7; font-weight: 600; }
    /* The breadcrumb and, on a first visit, the intro after it: one row, so neither covers the other. */
    #crumbrow { position: fixed; top: 64px; left: 24px; right: 24px; display: flex; gap: 12px; align-items: flex-start; pointer-events: none; }
    #crumbs { position: static; display: flex; gap: 2px; align-items: center; padding: 3px; flex-wrap: wrap; max-width: 60vw; flex: none; pointer-events: auto; }
    #crumbs button { background: none; border: 0; color: var(--dim); font: inherit; padding: 5px 8px; border-radius: 7px; cursor: pointer; }
    #crumbs button + button::before { content: '›'; margin-right: 8px; color: #334155; }
    #crumbs button:hover { color: var(--text); }
    #crumbs button.here { color: var(--text); font-weight: 600; }
    #crumbs .provenance { color: var(--dim); font: 11px ui-monospace, Consolas, monospace; padding: 0 8px 0 10px; border-left: 1px solid var(--line); margin-left: 6px; cursor: help; }
    #stats { left: 12px; bottom: 12px; padding: 10px 12px; white-space: pre; font: 11px/1.6 ui-monospace, 'Cascadia Mono', Consolas, monospace; color: #94a3b8; }
    #minimap { right: 12px; bottom: 40px; width: 240px; height: 150px; cursor: crosshair; }
    #minimap { transition: opacity 0.3s; }
    #minimap.faint { opacity: 0.3; }
    #minimap.faint:hover { opacity: 1; }
    #details { top: 72px; right: 12px; width: 330px; max-height: calc(100vh - 290px); overflow: auto; padding: 16px 16px 12px; }
    #details.folded { max-height: 58px; overflow: hidden; opacity: 0.85; transition: max-height 0.2s; }
    #details.folded:hover { max-height: calc(100vh - 290px); overflow: auto; opacity: 1; }
    #details[hidden] { display: none; }
    .d-head { display: flex; flex-direction: column; gap: 6px; }
    .d-kind { align-self: flex-start; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #0b0f17; background: #fbbf24; border-radius: 4px; padding: 2px 7px; font-weight: 700; }
    #details h2 { margin: 0; font-size: 19px; color: #f1f5f9; font-weight: 650; }
    .d-path { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 6px; }
    .d-path button, .d-rels button { background: none; border: 0; color: var(--dim); font: inherit; padding: 2px 4px; cursor: pointer; border-radius: 5px; }
    .d-path button + button::before { content: '›'; margin-right: 6px; color: #334155; }
    .d-path button:hover, .d-rels button:hover { color: var(--text); background: rgba(148, 163, 184, 0.1); }
    .d-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 4px; }
    .d-tags span { font-size: 11px; color: #cbd5e1; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
    .d-tags span.feat { color: #fde68a; border-color: rgba(251, 191, 36, .45); }
    #details p { color: #94a3b8; margin: 10px 0 4px; line-height: 1.5; }
    #details p.d-missed { color: #fbbf24; font-size: 12px; border-left: 2px solid rgba(251, 191, 36, 0.5); padding-left: 8px; }
    .d-file { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .d-filepath { font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--text); overflow-wrap: anywhere; }
    .d-facts { color: var(--dim); font-size: 11px; }
    .d-actions { display: flex; gap: 6px; margin-top: 6px; }
    .d-actions button { background: rgba(148, 163, 184, 0.1); border: 1px solid var(--line); color: var(--text); font: inherit; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
    .d-actions button.primary { background: #fbbf24; border-color: #fbbf24; color: #0b0f17; font-weight: 600; }
    .d-actions button:hover { filter: brightness(1.15); }
    #details p.d-rank { color: #fde68a; font-size: 12px; margin: 8px 0 0; }
    .d-rels { margin-top: 14px; }
    .d-rels h3 { margin: 0 0 4px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
    .d-rels.out h3, .d-rels.out i { color: #fbbf24; }
    .d-rels.in h3, .d-rels.in i { color: #22d3ee; }
    .d-rels ul { list-style: none; margin: 0; padding: 0; }
    .d-rels li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; border-radius: 6px; }
    .d-rels li.on { background: rgba(251, 191, 36, 0.14); }
    .d-rels.in li.on { background: rgba(34, 211, 238, 0.12); }
    .d-rels .d-rel { display: flex; gap: 6px; align-items: baseline; text-align: left; padding: 3px 6px; flex: 1 1 auto; min-width: 0; }
    .d-rels i { font-style: normal; }
    .d-rels b { color: #e2e8f0; font-weight: 600; flex: none; max-width: 62%; }
    .d-rels .d-rel span { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .d-rels .d-cite { color: var(--dim); font-size: 11px; padding: 2px 6px; flex: none; }
    .d-rels .d-cite[aria-expanded="true"] { color: var(--text); }
    .d-none { color: var(--dim); font-size: 11px; padding: 2px 6px; }
    #code { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .code { position: absolute; overflow: hidden; background: rgba(3, 6, 12, 0.7); border-radius: 6px; }
    .code[hidden] { display: none; }
    /* Both are laid out at 16 px from the card's top-left and scaled; columns sit where the code view puts them. */
    .code pre, .code canvas { position: absolute; left: 0; top: 0; margin: 0; transform-origin: 0 0; }
    .code pre[hidden] { display: none; }
    .code pre { font: 16px/1.45 ui-monospace, Consolas, monospace; color: #cbd5e1; }
    .code pre div { position: absolute; overflow: hidden; }
    .code pre span { display: block; white-space: pre; }
    .code pre i { font-style: normal; color: var(--faint); margin-right: 1ch; }
    .code pre em { font-style: normal; }
    .code pre .kw { color: #c4b5fd; }
    .code pre .str { color: #86efac; }
    .code pre .com { color: var(--dim); font-style: italic; }
    .code pre .num { color: #fdba74; }
    .code pre .ty { color: #7dd3fc; }
    /* Lines the graph marked: a cyan edge and their kind; lines a link cites: amber. */
    .code pre .mark { box-shadow: inset 3px 0 #22d3ee; background: rgba(34, 211, 238, 0.07); }
    .code pre span b { margin-left: 2ch; padding: 0 0.6ch; font-weight: 600; font-size: 0.8em; color: #67e8f9; border: 1px solid rgba(34, 211, 238, 0.5); border-radius: 4px; }
    .code pre .cited { background: rgba(251, 191, 36, 0.16); box-shadow: inset 3px 0 #fbbf24; }
    .code pre .cited b { color: #fde68a; border-color: rgba(251, 191, 36, 0.6); }
    .d-ev { flex-basis: 100%; margin: 0 0 6px 22px; display: flex; flex-direction: column; gap: 4px; }
    .d-ev > div { border-left: 2px solid var(--line); padding: 1px 0 1px 8px; }
    .d-ev .at { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 10px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; }
    .d-ev .at .cite { background: none; border: 0; padding: 0; font: inherit; color: #fde68a; cursor: pointer; text-decoration: underline dotted; }
    .d-ev .at .cite:hover { color: #fff; }
    .d-ev pre { margin: 1px 0 0; font: 11px/1.45 ui-monospace, Consolas, monospace; color: #cbd5e1; white-space: pre; overflow-x: auto; }
    .d-ev .stale { border-left-color: #b45309; }
    .d-ev em { display: block; font-size: 11px; color: #f59e0b; }
    .d-hint { margin-top: 12px; color: var(--faint); font-size: 11px; }
    /* The controls a newcomer needs first: readable (AA contrast), not small print. */
    #help { right: 12px; bottom: 12px; position: fixed; background: var(--panel); border: 1px solid var(--line); color: var(--text); font: inherit; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
    #help:hover { border-color: rgba(251, 191, 36, 0.5); }
    #stage canvas:focus { outline: none; }
    #stage canvas:focus-visible { outline: 2px solid rgba(251, 191, 36, 0.6); outline-offset: -2px; }
    /* Reduced motion: nothing slides, fades or flies. */
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
    /* Shown when the screen holds only empty space inside a card: how to get back. */
    /* First visit only: what the map is, beside the breadcrumb; gone at the first scroll, click or key. */
    #intro { min-width: 0; flex: 0 1 auto; height: 34px; display: block; line-height: 32px; padding: 0 14px; color: #cbd5e1; background: var(--panel); border: 1px solid rgba(251, 191, 36, 0.35); border-radius: 10px; font-size: 12.5px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.4s; }
    #intro b { color: #fbbf24; font-weight: 600; margin-right: 6px; }
    #intro.gone { opacity: 0; }
    #intro[hidden] { display: none; }
    @media (max-width: 900px) { #intro { display: none; } }
    #empty { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #b6c2d3; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-size: 13px; display: flex; gap: 12px; align-items: center; }
    #empty button { background: #fbbf24; border: 0; color: #0b0f17; font: inherit; font-weight: 600; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
    /* Reading a file: one column of code over the map, left of the details panel. */
    .reader { position: fixed; z-index: 15; top: 112px; left: 12px; right: 12px; bottom: 12px; display: flex; flex-direction: column; background: rgba(5, 8, 14, 0.97); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    body:has(#details:not([hidden])) .reader { right: 354px; }
    .reader[hidden] { display: none; }
    .reader-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    .reader-names { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .reader-title { font-weight: 650; color: #f1f5f9; font-size: 14px; white-space: nowrap; }
    .reader-where { color: var(--dim); font: 12px ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reader-head button { background: rgba(148, 163, 184, 0.1); border: 1px solid var(--line); color: var(--text); font: inherit; padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .reader-head .reader-back { background: none; border: 0; color: #fde68a; padding: 4px 0; }
    .reader-actions { display: flex; gap: 6px; }
    .reader-body { position: relative; flex: 1; min-height: 0; display: flex; }
    .reader-scroll { flex: 1; overflow: auto; outline: none; }
    .reader pre { margin: 0; padding: 8px 0 40vh; font: 13px/20px ui-monospace, Consolas, monospace; color: #cbd5e1; user-select: text; }
    .reader pre span { display: block; white-space: pre; padding: 0 16px 0 8px; }
    .reader pre i { font-style: normal; color: var(--faint); margin-right: 2ch; user-select: none; }
    .reader pre em { font-style: normal; }
    .reader pre .kw { color: #c4b5fd; } .reader pre .str { color: #86efac; } .reader pre .com { color: #8a99b0; font-style: italic; } .reader pre .num { color: #fdba74; } .reader pre .ty { color: #7dd3fc; }
    .reader pre .mark { box-shadow: inset 3px 0 #22d3ee; background: rgba(34, 211, 238, 0.07); }
    .reader pre .cited { background: rgba(251, 191, 36, 0.14); box-shadow: inset 3px 0 #fbbf24; }
    .reader pre .at { outline: 1px solid rgba(251, 191, 36, 0.7); }
    .reader pre span b { margin-left: 2ch; padding: 0 0.6ch; font-weight: 600; font-size: 0.85em; color: #67e8f9; border: 1px solid rgba(34, 211, 238, 0.5); border-radius: 4px; }
    .reader-rail { position: relative; width: 12px; flex: none; background: rgba(148, 163, 184, 0.06); }
    .reader-rail button { position: absolute; left: 1px; right: 1px; height: 4px; padding: 0; border: 0; border-radius: 2px; background: #22d3ee; cursor: pointer; }
    .reader-rail button.cited { background: #fbbf24; }
    .reader-none { padding: 24px; color: var(--text); font-family: 'Segoe UI', sans-serif; }
    /* While reading, the map's own furniture steps aside. */
    body.reading #minimap, body.reading #help, body.reading #empty { display: none; }
    #empty[hidden] { display: none; }
    .lensbar { position: relative; margin-left: auto; display: flex; align-items: center; gap: 2px; padding: 3px; }
    .lensbar button { background: none; border: 0; color: var(--dim); font: inherit; padding: 5px 9px; border-radius: 7px; cursor: pointer; }
    .lensbar button.on { color: #0b0f17; background: var(--accent); font-weight: 600; }
    /* The legend hangs below the lens bar, so picking a lens never reflows the top bar. */
    .lens-legend { position: absolute; top: calc(100% + 6px); right: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; color: var(--dim); font-size: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; white-space: nowrap; }
    .lens-legend[hidden] { display: none; }
    .lens-ramp { width: 110px; height: 8px; border-radius: 4px; }
    /* Altimeter: depth gauge on the left edge. */
    /* Region title card. */
    kbd { font: 600 10px ui-monospace, Consolas, monospace; color: #94a3b8; border: 1px solid #334155; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: rgba(15, 23, 42, 0.8); }
    #travel { width: 240px; white-space: nowrap; overflow: hidden; gap: 10px; text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--dim); border-radius: 10px; padding: 8px 12px; font: inherit; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    #travel:hover { color: var(--text); border-color: rgba(251, 191, 36, 0.4); }
    /* Toast */
    .toast { position: fixed; z-index: 50; left: 50%; bottom: 96px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; display: flex; gap: 10px; align-items: center; background: rgba(10, 14, 22, 0.92); border: 1px solid rgba(251, 191, 36, 0.35); color: #e2e8f0; padding: 9px 14px; border-radius: 10px; font-size: 13px; transition: opacity 0.18s, transform 0.18s; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    /* Palette */
    .palette { position: fixed; z-index: 30; left: 50%; top: 14vh; transform: translate(-50%, 0); width: min(680px, 90vw); background: rgba(9, 12, 20, 0.97); border: 1px solid rgba(251, 191, 36, 0.35); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7); overflow: hidden; }
    .palette[hidden] { display: none; }
    .palette input { width: 100%; background: none; border: 0; border-bottom: 1px solid #1e293b; color: #f1f5f9; font: 17px 'Segoe UI', sans-serif; padding: 16px 18px; outline: none; }
    .palette-list { max-height: 52vh; overflow: auto; padding: 6px; }
    .palette .row { display: grid; grid-template-columns: 86px auto 1fr; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
    .palette .row.on { background: rgba(251, 191, 36, 0.14); }
    .palette .row .kind { font: 600 9px ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
    .palette .row b { color: #e2e8f0; font-weight: 600; }
    .palette .row .sub { color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .palette .none { color: #94a3b8; font-size: 13px; padding: 10px 10px 8px; }
    /* Tooltips */
    /* Context menu */
    .menu { z-index: 35; min-width: 180px; padding: 4px; display: flex; flex-direction: column; background: #0b1220; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); }
    .menu[hidden] { display: none; }
    .menu-title { font-size: 11px; color: var(--dim); padding: 6px 10px 4px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .menu button { display: flex; justify-content: space-between; gap: 16px; background: none; border: 0; color: var(--text); font: inherit; padding: 6px 10px; border-radius: 6px; cursor: pointer; text-align: left; }
    .menu button:hover, .menu button:focus-visible { background: rgba(251, 191, 36, 0.16); outline: none; }
    .tip { position: fixed; z-index: 20; width: 280px; pointer-events: none; background: rgba(9, 12, 20, 0.96); border: 1px solid #334155; border-radius: 10px; padding: 11px 13px 13px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6); font-size: 12px; animation: tipin 0.12s ease; }
    .tip[hidden] { display: none; }
    @keyframes tipin { from { opacity: 0; transform: translateY(4px); } }
    .tip-kind { font: 600 9px ui-monospace, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
    .tip-title { font-size: 15px; font-weight: 600; color: #f1f5f9; margin: 2px 0 6px; }
    .tip-desc { color: #94a3b8; line-height: 1.45; margin-bottom: 6px; }
    .tip-counts { color: var(--dim); font-size: 11px; margin-bottom: 4px; }
    /* Controls screen */
    .help-overlay { position: fixed; inset: 0; z-index: 40; background: rgba(3, 5, 10, 0.85); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; overflow: auto; }
    .help-overlay[hidden] { display: none; }
    .help-box { display: flex; flex-direction: column; align-items: center; padding: 24px 0; }
    .help-close { margin-top: 20px; background: rgba(148, 163, 184, 0.12); border: 1px solid var(--line); color: var(--text); font: inherit; padding: 6px 18px; border-radius: 8px; cursor: pointer; }
    .help-overlay h2 { font: 300 30px 'Segoe UI', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: #f1f5f9; margin: 0 0 22px; }
    .help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 32px; max-width: 1040px; width: 100%; padding: 0 24px; }
    .help-col h3 { font: 600 11px ui-monospace, monospace; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
    .help-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid #1e293b; color: #b6c2d3; }
    .help-row b { color: var(--text); font-weight: 600; white-space: nowrap; }
    .help-row kbd { white-space: nowrap; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="code"></div>
  <div id="top" class="panel">
    <div id="brand" class="panel" style="position: static">Zoom spike</div>
    <nav id="models" class="panel" style="position: static"></nav>
    <button id="travel">Travel to…<kbd>Ctrl K</kbd></button>
    <nav id="views" class="panel" style="position: static" hidden></nav>
  </div>
  <div id="crumbrow">
    <div id="crumbs" class="panel"></div>
    <div id="intro" hidden><b>New here?</b>Cards are the parts of the product, arrows how they use each other (thicker carries more). Scroll into a card to open it · double-click a file to read it · ? for every control</div>
  </div>
  <div id="stats" class="panel">loading…</div>
  <aside id="details" class="panel" hidden></aside>
  <canvas id="minimap" class="panel"></canvas>
